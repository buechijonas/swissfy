{% load static %}
{% load i18n %}
<header>
    <a href="{% url 'home' %}" class="logo">
        <div class="swissfy text-bold">
            <p class="text-black">SwissFY</p>
        </div>
        <div class="kiidle">
            <p>
                <span class="text-blue text-bold">K</span>
                <span class="text-red text-bold">i</span>
                <span class="text-yellow text-bold">i</span>
                <span class="text-blue text-bold">d</span>
                <span class="text-green text-bold">l</span>
                <span class="text-red text-bold">e</span>
            </p>
        </div>
    </a>
    {% if icon2 %}
        <a href="{% if url2 %}{% url url2 %}{% endif %}" class="column2 d-flex justify-center align-center">
            <div class="icon">
                <img src="{% static 'svgs/'|add:icon2|add:'.svg' %}" height="100%"/>
            </div>
        </a>
    {% endif %}
    {% if icon1 %}
        <a href="{% if url1 %}{% url url1 %}{% endif %}" class="column1 d-flex justify-center align-center">
            <div class="icon">
                <img src="{% static 'svgs/'|add:icon1|add:'.svg' %}" height="100%"/>
            </div>
        </a>
    {% endif %}
</header>
