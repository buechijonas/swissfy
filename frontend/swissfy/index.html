<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ca0000" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#ef4136" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Swissfy">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Swissfy</title>
    <script src="/theme.js"></script>
    <style>
      html {
        background-color: oklch(100% 0 0);
      }
      [data-theme='dark'] {
        background-color: oklch(25.33% 0.016 252.42);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          background-color: oklch(25.33% 0.016 252.42);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
